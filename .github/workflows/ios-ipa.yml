
name: Build Flutter IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter packages
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install


      - name: Build iOS release
        run: |
          flutter build ios --release --no-codesign
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/Runner-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-unsigned-IPA
          path: Runner-unsigned.ipa
          retention-days: 7


      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/Runner-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-unsigned-IPA
          path: Runner-unsigned.ipa
          retention-days: 7
